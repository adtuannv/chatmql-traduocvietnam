# ══════════════════════════════════════════════════════════════════════
# nginx cho site dev — chatmql-dev.traduocvietnam.com
#
# KIẾN TRÚC: MỘT TÊN MIỀN DUY NHẤT
# Anh chỉ trỏ một domain, nên backend không nằm ở subdomain riêng mà đi qua
# chính domain này bằng reverse proxy:
#
#   /            → file tĩnh trong /www/wwwroot/chatmql-dev.traduocvietnam.com
#   /api/        → Node backend cổng 4520
#   /uploads/    → Node backend (ảnh sản phẩm, ảnh chat)
#   /socket.io/  → Node backend (WebSocket, tin nhắn thời gian thực)
#
# Lợi ích: chỉ cần MỘT chứng chỉ SSL, và không phải cấu hình CORS vì trình
# duyệt gọi cùng origin.
#
# CÁCH DÙNG trong aaPanel:
#   Website → chatmql-dev.traduocvietnam.com → Config (Cấu hình)
#   → dán phần server{...} bên dưới, đè lên cấu hình mặc định → Save → Reload
# ══════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name chatmql-dev.traduocvietnam.com;

    # aaPanel tự chèn phần chuyển hướng HTTPS sau khi anh bật SSL.
    # Trước khi có SSL thì site chạy tạm bằng HTTP.

    root /www/wwwroot/chatmql-dev.traduocvietnam.com;
    index index.html;

    # Ảnh sản phẩm 1000x1000 khoảng 1–2 MB; đơn hàng có thể đính kèm ảnh.
    client_max_body_size 25m;

    access_log /www/wwwlogs/chatmql-dev.log;
    error_log  /www/wwwlogs/chatmql-dev.error.log;

    # ── API ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:4520;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI trả lời có thể mất 30–60 giây (gọi mô hình + tra cứu công cụ).
        # Để mặc định 60s thì nhân viên sẽ thấy lỗi 504 giữa chừng.
        proxy_read_timeout    180s;
        proxy_send_timeout    180s;
        proxy_connect_timeout 30s;

        # Không đệm: tin nhắn và luồng AI cần tới nơi ngay.
        proxy_buffering off;
    }

    # ── Ảnh và tệp đính kèm ───────────────────────────────────────────
    # ^~ là BẮT BUỘC, không phải cho đẹp: thiếu nó thì bất kỳ khối
    # `location ~* \.(png|jpg|…)$` nào khác trong cấu hình cũng cướp mất
    # request ảnh, vì trong nginx regex thắng prefix. Hậu quả là mọi ảnh do hệ
    # thống lưu (tài liệu bán hàng, ảnh chat, ảnh sản phẩm) trả 404 của nginx
    # còn backend không hề thấy request — đã xảy ra đúng như vậy trên bản thật.
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4520;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── WebSocket cho tin nhắn thời gian thực ─────────────────────────
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4520;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # giữ kết nối lâu, tránh rớt liên tục
    }

    # ── App mobile (PWA) tại /m/ ──────────────────────────────────────
    # File tĩnh nằm ở $root/m (giải nén m-dist.zip vào đó).
    location /m/ {
        try_files $uri $uri/ /m/index.html;
    }
    # Service worker TUYỆT ĐỐI không cache — cache sw.js là người dùng kẹt ở
    # bản cũ vĩnh viễn, muốn sửa cũng không đẩy nổi bản mới xuống máy họ.
    location = /m/sw.js {
        add_header Cache-Control "no-store";
    }
    location = /m/manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }
    location ~* ^/m/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Ứng dụng một trang ────────────────────────────────────────────
    # Mọi đường dẫn không phải file thật đều trả index.html, nếu không
    # F5 ở /conversations sẽ ra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File build có tên kèm mã băm nên cache lâu được.
    # index.html thì KHÔNG cache, để deploy bản mới là thấy ngay.
    location ~* ^/assets/.*\.(js|css|woff2?|png|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /order-ui-bridge.js {
        add_header Cache-Control "no-store";
    }

    # ── Trang Train AI (bộ não trợ lý) ────────────────────────────────
    # File tĩnh train-ai.html ở gốc site; /train-ai là địa chỉ gọn cho dễ nhớ.
    # Cầu nối train-ai-bridge.js gắn chính trang này vào mục "Logic AI" của
    # bản desktop, nên cả hai file đều KHÔNG được cache — sửa là thấy ngay.
    location = /train-ai {
        try_files /train-ai.html =404;
    }
    location = /train-ai.html {
        add_header Cache-Control "no-store";
    }
    location = /train-ai-bridge.js {
        add_header Cache-Control "no-store";
    }
}
